<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1f36"/>
      <stop offset="100%" stop-color="#150f1c"/>
    </linearGradient>
    <linearGradient id="hood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#f7b32b" stroke-width="2.5"/>

  <!-- Orbital Track / Equator Ring -->
  <ellipse cx="32" cy="46" rx="22" ry="6" fill="none" stroke="#f7b32b" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.45"/>

  <!-- Iconic Cel-Shaded Indian Auto Rickshaw -->
  <g transform="translate(13, 14)">
    <!-- Rear Cabin & Chassis Shadow -->
    <ellipse cx="19" cy="31" rx="16" ry="3.5" fill="#000000" opacity="0.35"/>

    <!-- Wheels -->
    <!-- Back Wheel -->
    <circle cx="9" cy="27" r="5" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
    <circle cx="9" cy="27" r="2" fill="#78716c"/>
    <!-- Front Wheel -->
    <circle cx="29" cy="27" r="5" fill="#1c1917" stroke="#44403c" stroke-width="1.5"/>
    <circle cx="29" cy="27" r="2" fill="#78716c"/>
    <path d="M 29 27 L 27 18" stroke="#44403c" stroke-width="2" stroke-linecap="round"/>

    <!-- Lower Green Body -->
    <path d="M 5 21 L 5 26 C 5 27 6 28 8 28 L 29 28 C 31 28 32 26 31 24 L 29 18 L 19 18 L 19 21 Z" fill="url(#body)" stroke="#111827" stroke-width="1"/>
    
    <!-- Cabin Opening / Doorway (Dark interior) -->
    <path d="M 9 10 L 19 10 L 19 22 L 8 22 Z" fill="#1e1b24"/>

    <!-- Windshield Frame & Glass -->
    <path d="M 20 8 L 28 17 L 20 17 Z" fill="url(#glass)" stroke="#111827" stroke-width="1"/>
    <!-- Glass Highlight Reflection -->
    <path d="M 22 9 L 26 15" stroke="#ffffff" stroke-width="1" stroke-linecap="round" opacity="0.75"/>

    <!-- Yellow Canopy Roof -->
    <path d="M 4 10 C 4 6 7 4 13 4 L 24 5 C 27 5.5 28 7 28 9 L 20 8 L 5 9 Z" fill="url(#hood)" stroke="#111827" stroke-width="1"/>
    <!-- Roof rib curve -->
    <path d="M 12 4.5 C 13 6.5 13 8 13 9" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.7"/>

    <!-- Front Mudguard & Apron -->
    <path d="M 27 18 L 33 21 C 34 22 34 23 33 24 L 28 24 Z" fill="url(#body)" stroke="#111827" stroke-width="0.8"/>

    <!-- Headlight Beam -->
    <polygon points="33,22 41,18 41,27 33,24" fill="#fef08a" opacity="0.3" filter="url(#glow)"/>
    <circle cx="33" cy="22.5" r="1.8" fill="#fef08a" stroke="#d97706" stroke-width="0.5"/>
  </g>

  <!-- Star / Sparkle Accent -->
  <polygon points="49,12 51,16 55,17 51,18 49,22 48,18 44,17 48,16" fill="#f7b32b" opacity="0.85"/>
</svg>